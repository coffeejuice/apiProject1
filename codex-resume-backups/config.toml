model = "gpt-5.5"
model_reasoning_effort = "xhigh"
service_tier = "fast"
approvals_reviewer = "user"
personality = "pragmatic"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[tui.keymap.composer]
submit = "alt-s"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/alextub/Documents/apiProject1", "/tmp"]

[mcp_servers.filesystem.tools.create_directory]
approval_mode = "approve"

[mcp_servers.filesystem.tools.edit_file]
approval_mode = "approve"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"

[mcp_servers.postgres]
command = "bash"
args = ["-lc", 'set -euo pipefail; set -a; source /home/alextub/Documents/apiProject1/backend/.env; set +a; db="${POSTGRES_CONNECTION_STRING:-${DATABASE_URL:-${DB_ADMIN_URL:-}}}"; if [ -z "$db" ]; then echo "No DB URL found in backend/.env" >&2; exit 1; fi; db="${db/postgresql+psycopg:/postgresql:}"; db="${db/postgresql+asyncpg:/postgresql:}"; exec npx -y @modelcontextprotocol/server-postgres "$db"']

[mcp_servers.postgres.tools.query]
approval_mode = "approve"

[mcp_servers.fastapi_bridge]
command = "bash"
args = ["-lc", "exec /home/alextub/Documents/apiProject1/backend/.venv/bin/python /home/alextub/Documents/apiProject1/backend/scripts/fastapi_bridge_mcp.py --openapi-url http://127.0.0.1:8001/openapi.json --base-url http://127.0.0.1:8001"]

[mcp_servers.terminal]
command = "bash"
args = ["-lc", "exec /home/alextub/Documents/apiProject1/backend/.venv/bin/python /home/alextub/Documents/apiProject1/backend/scripts/terminal_mcp.py"]

[mcp_servers.terminal.tools.run_command]
approval_mode = "approve"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[projects."/home/alextub/Documents/apiProject1"]
trust_level = "trusted"

[projects."/home/alextub"]
trust_level = "trusted"

[projects."/home/alextub/Documents"]
trust_level = "trusted"

[notice]
hide_full_access_warning = true

[notice.model_migrations]
"gpt-5.3-codex" = "gpt-5.4"

sandbox_mode = "danger-full-access"

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[features]
js_repl = true
guardian_approval = true

[tui.model_availability_nux]
"gpt-5.5" = 4


logger:
  root_module_name: forgelab
  host: 127.0.0.1
  port: 3130

server:
  version: v3.0.1
  is_allow_restart: false
  is_development_mode: false
  document_version_name_prefix_for_development_mode: "[DEV]"
  notify_timeout: 0.1
  timeout_query_missed_tasks: 5.0
  timeout_counter: 0
  queue_timeout: 30.0
  cpu_performance: 1.0
  cpu_count_deform_license_max_limit: 4
  cpu_count_available: 0
  cpu_count: 0
  ram_free_size_gb: 0
  hdd_free_size_gb: 0
  projects_dir: forgelabProjects
  local_dir: ""
  deform_installation_path: "C:\\Program Files\\SFTC\\DEFORM\\v11.0.2"
  billet_extract_dir_name: extract
  remote_file_server_username: nas_user
  remote_file_server_password: "Nas123&123"
  file_remove_attempts_before_raising_error: 10
  file_remove_attempts_cycle_time_sec: 30.0

services:
  pre:
    is_service_allowed_to_run: true
    notify_channel: operations_changes
    notify_timeout: 0.1
    max_threads_count: 1
    operations_settings:
      prolongation:
        single_bite_criteria:
          length_to_feed_ratio: 1.5
          height_to_feed_ratio: 2.75
        allowed_feed_pointers:
          - relative_die_center
          - absolute_die_center
          - relative_die_edge
          - absolute_die_edge
        allowed_feed_modes:
          - manual_feed
          - automatic_feed
        automatic_feed_control:
          when_last_feed_is_controlled:
            last_manual_feeds_count: 3
  simulation:
    is_service_allowed_to_run: true
    notify_channel: simulation_status_changed
    notify_timeout: 1
    max_threads_count: 2
  mayavi:
    is_service_allowed_to_run: true
    notify_channel: ""
    notify_timeout: 1
    max_threads_count: 0
  post:
    is_service_allowed_to_run: true
    notify_channel: simulation_of_operation_finished
    notify_timeout: 1
    max_threads_count: 0

# Additional settings not in config.json
worker:
  pool_size: 5
timeout_seconds: 30
theme: dark
precision: 4
